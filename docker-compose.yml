services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sweettrack-sql
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    restart: unless-stopped

volumes:
  mssql_data:
